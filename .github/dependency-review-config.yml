# Fail on high-severity or critical vulnerabilities introduced by a PR.
# Allow common permissive open-source licenses used by konform's dependency tree.
fail-on-severity: high
allow-licenses:
  - MIT
  - Apache-2.0
  - Apache-2.0 WITH LLVM-exception
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - MPL-2.0
  - Zlib
  - CC0-1.0
  - Unicode-DFS-2016
  - Unicode-3.0
