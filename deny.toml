# cargo-deny configuration for konform.
# See: https://embarkstudios.github.io/cargo-deny/

[licenses]
# Allow common permissive licenses present in the konform dependency tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
]

[bans]
# Warn (don't fail) when multiple versions of the same crate are pulled in.
multiple-versions = "warn"
wildcards = "allow"

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Add advisory IDs here to suppress known false-positives, e.g.:
# ignore = ["RUSTSEC-0000-0000"]
ignore = []

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
