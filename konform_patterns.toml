# konform_patterns.toml — project-specific KPT pattern rules
#
# This file is auto-discovered by konform when it sits alongside
# pyproject.toml / konform.toml.  It can also be referenced explicitly:
#
#   [tool.konform.KPT]
#   rules_file = "konform_patterns.toml"
#
# Patterns are matched line-by-line against the source text using Rust
# regular expressions (https://docs.rs/regex).  Every entry needs:
#
#   id      — violation code shown in output and used for `# noqa` suppression
#   message — human-readable description of the violation
#   pattern — regex matched against each source line
#
# Optional per-entry fields:
#
#   files   — list of glob patterns; when omitted the rule applies to all files
#   level   — "error" or "warning" (default: inherits [tool.konform.KPT].level)
#
# Suppress a specific violation on a line:
#   print(x)  # noqa: KPT001
#   print(x)  # noqa: KPT        ← silences all KPT rules on this line

# ---------------------------------------------------------------------------
# Debugging artefacts
# ---------------------------------------------------------------------------

[[rules]]
id      = "KPT001"
message = "Remove bare print() — use the project logger instead."
pattern = '^\s*print\s*\('
files   = ["python/**/*.py", "src/**/*.py"]
level   = "warning"

[[rules]]
id      = "KPT002"
message = "Remove breakpoint() — debugging artefact must not be committed."
pattern = '^\s*breakpoint\s*\(\s*\)'
level   = "error"

[[rules]]
id      = "KPT003"
message = "Remove pdb / ipdb trace — debugging artefact must not be committed."
pattern = '(pdb|ipdb)\s*\.\s*set_trace\s*\('
level   = "error"

# ---------------------------------------------------------------------------
# Code hygiene
# ---------------------------------------------------------------------------

[[rules]]
id      = "KPT010"
message = "Resolve or ticket this TODO before merging."
pattern = '#\s*TODO'
files   = ["python/**/*.py", "tests/**/*.py"]
level   = "warning"

[[rules]]
id      = "KPT011"
message = "FIXME must be resolved before merging."
pattern = '#\s*FIXME'
level   = "error"

[[rules]]
id      = "KPT012"
message = "HACK comment detected — prefer a proper fix or a tracked issue."
pattern = '#\s*HACK'
level   = "warning"
