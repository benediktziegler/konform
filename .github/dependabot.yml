version: 2
updates:
  # Rust — main crate
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "rust"

  # Rust — Zed extension (separate Cargo.toml)
  - package-ecosystem: "cargo"
    directory: "/extensions/zed-extension"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "rust"
      - "zed"

  # Python development dependencies (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
