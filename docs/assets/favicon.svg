<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="8" y1="0" x2="56" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26c6a8"/>
      <stop offset="1" stop-color="#00695c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#bg)"/>
  <rect width="64" height="64" rx="18" fill="url(#sheen)"/>
  <!-- three blocks locked to the grid -->
  <g fill="#003d33" fill-opacity=".3" transform="translate(0 2)">
    <rect x="11" y="11" width="20" height="20" rx="6"/>
    <rect x="33" y="11" width="20" height="20" rx="6"/>
    <rect x="11" y="33" width="20" height="20" rx="6"/>
  </g>
  <g fill="#fff">
    <rect x="11" y="11" width="20" height="20" rx="6"/>
    <rect x="33" y="11" width="20" height="20" rx="6"/>
    <rect x="11" y="33" width="20" height="20" rx="6"/>
  </g>
  <!-- empty slot where the fourth belongs -->
  <rect x="34" y="34" width="18" height="18" rx="5" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2" stroke-dasharray="3.5 3"/>
  <!-- fourth block, still tilted, sliding in -->
  <rect x="38" y="38" width="20" height="20" rx="6" fill="#ffd54f" transform="rotate(14 48 48)"/>
</svg>
