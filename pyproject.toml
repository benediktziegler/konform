[build-system]
requires      = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name    = "konform"
version = "0.1.2"
authors = [
  { name = "Benedikt Ziegler", email = "benediktziegler@gmail.com" },
]
description     = "Multi-rule Python linter and language server — fast, configurable, CI-ready"
readme          = "README.md"
requires-python = ">=3.10"
keywords        = ["konform", "python", "linter", "imports", "language-server"]
license         = { text = "MIT" }
classifiers     = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = []

[project.urls]
Homepage      = "https://github.com/benediktziegler/konform"
Source        = "https://github.com/benediktziegler/konform"
"Bug Tracker" = "https://github.com/benediktziegler/konform/issues"

[tool.maturin]
bindings = "bin"
profile  = "release"

# ---------------------------------------------------------------------------
# Changelog / release metadata
# ---------------------------------------------------------------------------
[tool.commitizen]
name                     = "cz_conventional_commits"
tag_format               = "v$version"
version_scheme           = "semver"
version_provider         = "pep621"
update_changelog_on_bump = true
changelog_file           = "CHANGELOG.md"
allowed_prefixes         = ["Merge", "Revert", "fixup!", "squash!"]
version_files = [
    "Cargo.toml:^version",
]

[dependency-groups]
dev = [
  "ipython",
  "maturin>=1.0,<2.0",
]
