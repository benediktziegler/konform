# Ruff defaults shared across all konform environments.
# To extend or override, add the corresponding section to your pyproject.toml.
# For more information see https://hatch.pypa.io/latest/config/internal/static-analysis/#extending-config.

# ruff_defaults version
# Update this version number when you make changes to the ruff configuration.
# version: 0.1.0

line-length = 120
indent-width = 4

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

